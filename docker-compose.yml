services:
  web:
    build: .
    container_name: viniciusmachado
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.viniciusmachado.rule=Host(`viniciusmachado.com`) || Host(`www.viniciusmachado.com`)"
      - "traefik.http.routers.viniciusmachado.entrypoints=websecure"
      - "traefik.http.routers.viniciusmachado.tls.certresolver=letsencrypt"
      - "traefik.http.services.viniciusmachado.loadbalancer.server.port=3000"
    networks:
      - traefik_network

networks:
  traefik_network:
    external: true
